version: '3.8'

services:
  web:
    build: .
    container_name: book_backend_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/book_system
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: book_backend_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_system
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql


volumes:
  db_data: