version: '3.8'

services:
  web:
    build: .
    container_name: book_backend_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/book_system
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TZ=Asia/Shanghai
    depends_on:
      - db
      - redis
  db:
    image: mysql:8.0
    container_name: book_backend_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_system
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  db_data: